<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tektur:wght@400..900&display=swap" rel="stylesheet">
  <style>
    body {
      background-image: url('forgot.svg');
      width: 90vw;
      max-height : 80vh;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 150px;
      height: 50vh;
      width : 70vw;
      background-color: rgb(27, 26, 26, 0.9);
      margin-left: 215px;
      margin-right: 80px;
      border-radius: 20px;
    }
    .innerbox {
      border-color: rgb(160, 159, 156);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90%;
      height: 80%;
      border-radius: 18px;
      border-style: dashed;
      border-width: 2px;
    }
    h1 {
      font-family: Tektur;
      font-size: medium;
      color: rgb(153, 46, 28);
    }
    </style>
</head>
<body>
  <div class="container">
    <div class="innerbox">
     <h1> Link to reset your password has been sent! </h1>
     <h1>Please check your email inbox.</h1>
    </div>
  </div>
</body>
</html>
